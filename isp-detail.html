  <script>
    // Extract ISP from clean URL path (/isp/PTCL) or fallback to query param
    const pathMatch = window.location.pathname.match(/^\/isp\/(.+)$/);
    const ispName = pathMatch ? decodeURIComponent(pathMatch[1]) : new URLSearchParams(window.location.search).get('isp');
    let currentLang = localStorage.getItem('pakspeed_lang') || 'ur';

    if (!ispName) {
      window.location.href = '/isp.html';
    }

    function applyLang(lang) {
      currentLang = lang;
      localStorage.setItem('pakspeed_lang', lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ur' ? 'rtl' : 'ltr';
      document.body.className = lang === 'ur' ? 'lang-ur' : 'lang-en';
      document.getElementById('btn-lang').textContent = lang === 'ur' ? 'English' : 'اردو';
      document.getElementById('back-text').textContent = lang === 'ur' ? 'آئی ایس پی موازنہ' : 'ISP Comparison';
      document.getElementById('footer-madein').textContent = lang === 'ur' ? 'پاکستان میں بنایا گیا' : 'Made in Pakistan';
      document.getElementById('footer-init-text').textContent = lang === 'ur' ? 'کی ایک پہل' : 'An initiative by';
    }

    applyLang(currentLang);
    document.getElementById('btn-lang').addEventListener('click', () => {
      applyLang(currentLang === 'ur' ? 'en' : 'ur');
      if (window._ispData) renderIsp(window._ispData);
      if (window._reviewData) renderReviews(window._reviewData);
    });

    const API = `https://pakspeed-worker.qaisar-roonjha.workers.dev/api/isp-stats?isp=${encodeURIComponent(ispName)}`;

    function renderIsp(data) {
      const { isp, national_avg, cities } = data;
      if (!isp || !isp.total_tests) {
        document.getElementById('city-loading').textContent = 'No data for this ISP';
        return;
      }

      const isUrdu = currentLang === 'ur';

      const titleText = isUrdu
        ? `${ispName} سپیڈ ٹیسٹ — PakSpeed`
        : `${ispName} Speed Test — PakSpeed`;
      const descText = isUrdu
        ? `${ispName} کی اوسط سپیڈ ${isp.avg_download} Mbps ہے۔ ${isp.total_tests} ٹیسٹ کے نتائج۔`
        : `${ispName} average speed is ${isp.avg_download} Mbps based on ${isp.total_tests} tests.`;

      document.getElementById('page-title').textContent = titleText;
      document.getElementById('page-desc').setAttribute('content', descText);

      // Update canonical, OG, hreflang dynamically — clean URLs
      const ispUrl = `https://pakspeed.com/isp/${encodeURIComponent(ispName)}`;
      document.getElementById('page-canonical').href = ispUrl;
      document.getElementById('hreflang-ur').href = ispUrl + '?lang=ur';
      document.getElementById('hreflang-en').href = ispUrl + '?lang=en';
      document.getElementById('hreflang-default').href = ispUrl;
      document.getElementById('og-url').content = ispUrl;
      document.getElementById('og-title').content = titleText;
      document.getElementById('og-desc').content = descText;
      document.getElementById('tw-title').content = titleText;
      document.getElementById('tw-desc').content = descText;

      // Schema.org — ISP detail + BreadcrumbList
      document.getElementById('schema-json').textContent = JSON.stringify([
        {
          "@context": "https://schema.org",
          "@type": "WebPage",
          "name": titleText,
          "description": descText,
          "url": `https://pakspeed.com/isp/${encodeURIComponent(ispName)}`,
          "inLanguage": ["ur", "en"],
          "isPartOf": { "@type": "WebSite", "name": "PakSpeed", "url": "https://pakspeed.com" }
        },
        {
          "@context": "https://schema.org",
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "PakSpeed", "item": "https://pakspeed.com/" },
            { "@type": "ListItem", "position": 2, "name": isUrdu ? "آئی ایس پی موازنہ" : "ISP Comparison", "item": "https://pakspeed.com/isp.html" },
            { "@type": "ListItem", "position": 3, "name": ispName }
          ]
        }
      ]);

      document.getElementById('isp-name').textContent = isUrdu
        ? `${ispName} سپیڈ ٹیسٹ`
        : `${ispName} Speed Test`;
      document.getElementById('isp-subtitle').textContent = isUrdu
        ? `${isp.total_tests} سپیڈ ٹیسٹ کے نتائج پر مبنی`
        : `Based on ${isp.total_tests} speed tests`;

      document.getElementById('lbl-dl').textContent = isUrdu ? 'اوسط ڈاؤن لوڈ' : 'Avg Download';
      document.getElementById('lbl-ul').textContent = isUrdu ? 'اوسط اپ لوڈ' : 'Avg Upload';
      document.getElementById('lbl-ping').textContent = isUrdu ? 'اوسط پنگ' : 'Avg Ping';
      document.getElementById('lbl-peak').textContent = isUrdu ? 'زیادہ سے زیادہ' : 'Peak Speed';

      document.getElementById('val-dl').textContent = isp.avg_download;
      document.getElementById('val-ul').textContent = isp.avg_upload;
      document.getElementById('val-ping').textContent = isp.avg_ping;
      document.getElementById('val-peak').textContent = isp.max_download;

      // National comparison
      const diff = (isp.avg_download - national_avg).toFixed(1);
      const pct = ((Math.abs(diff) / national_avg) * 100).toFixed(0);
      const compBox = document.getElementById('comparison-box');
      if (diff > 0) {
        compBox.innerHTML = `<p class="comparison-text">${isUrdu
          ? `${ispName} کی سپیڈ قومی اوسط سے <span class="comp-faster">${pct}% تیز</span> ہے`
          : `${ispName} is <span class="comp-faster">${pct}% faster</span> than the national average`}</p>`;
      } else {
        compBox.innerHTML = `<p class="comparison-text">${isUrdu
          ? `${ispName} کی سپیڈ قومی اوسط سے <span class="comp-slower">${pct}% سست</span> ہے`
          : `${ispName} is <span class="comp-slower">${pct}% slower</span> than the national average`}</p>`;
      }

      // Cities table
      document.getElementById('cities-title').textContent = isUrdu
        ? `${ispName} شہروں کی سپیڈ`
        : `${ispName} Speed by City`;
      document.getElementById('th-city').textContent = isUrdu ? 'شہر' : 'City';
      document.getElementById('th-dl2').textContent = isUrdu ? 'ڈاؤن لوڈ' : 'Download';
      document.getElementById('th-ul2').textContent = isUrdu ? 'اپ لوڈ' : 'Upload';
      document.getElementById('th-ping2').textContent = isUrdu ? 'پنگ' : 'Ping';
      document.getElementById('th-tests2').textContent = isUrdu ? 'ٹیسٹ' : 'Tests';

      let html = '';
      (cities || []).forEach(c => {
        html += `<tr>
          <td style="font-weight:600;"><a href="/city/${encodeURIComponent(c.city)}/${encodeURIComponent(ispName)}" style="color:var(--white);text-decoration:none;border-bottom:1px dashed rgba(255,255,255,0.3);">${c.city}</a></td>
          <td style="font-family:var(--font-en);font-weight:800;color:var(--neon-green);">${c.avg_download} <small style="color:var(--gray-400)">Mbps</small></td>
          <td style="font-family:var(--font-en);font-weight:600;color:var(--neon-blue);">${c.avg_upload} <small style="color:var(--gray-400)">Mbps</small></td>
          <td style="font-family:var(--font-en);font-weight:600;color:var(--gold);">${c.avg_ping} <small style="color:var(--gray-400)">ms</small></td>
          <td style="font-family:var(--font-en);color:var(--gray-400);">${c.total_tests}</td>
        </tr>`;
      });
      document.getElementById('cities-body').innerHTML = html;

      document.getElementById('cta-text').textContent = isUrdu
        ? `اپنی ${ispName} سپیڈ چیک کریں`
        : `Test Your ${ispName} Speed`;

      // Explore links — cross-linking for SEO
      document.getElementById('explore-title').textContent = isUrdu ? 'مزید دریافت کریں' : 'Explore More';
      const majorISPs = ['PTCL','Jazz','Zong','Telenor','Ufone','StormFiber','Nayatel','Transworld'];
      const otherISPs = majorISPs.filter(i => i !== ispName).slice(0, 4);
      let exploreHtml = '';
      otherISPs.forEach(i => {
        exploreHtml += `<a href="/isp/${encodeURIComponent(i)}" class="explore-link">${i}</a>`;
      });
      exploreHtml += `<a href="/isp.html" class="explore-link secondary">${isUrdu ? 'آئی ایس پی موازنہ' : 'ISP Comparison'}</a>`;
      exploreHtml += `<a href="/leaderboard.html" class="explore-link secondary">${isUrdu ? 'شہر رینکنگ' : 'City Rankings'}</a>`;
      exploreHtml += `<a href="/map.html" class="explore-link secondary">${isUrdu ? 'سپیڈ میپ' : 'Speed Map'}</a>`;
      exploreHtml += `<a href="/guide.html" class="explore-link secondary">${isUrdu ? 'سپیڈ گائیڈ' : 'Speed Guide'}</a>`;
      exploreHtml += `<a href="/complaint.html" class="explore-link secondary">${isUrdu ? 'PTA شکایت' : 'PTA Complaint'}</a>`;
      exploreHtml += `<a href="/best-isp.html" class="explore-link secondary">${isUrdu ? 'بہترین ISP 2026' : 'Best ISP 2026'}</a>`;
      exploreHtml += `<a href="/report.html" class="explore-link secondary">${isUrdu ? 'آج کی رپورٹ' : "Today's Report"}</a>`;
      document.getElementById('explore-links').innerHTML = exploreHtml;

      document.getElementById('city-loading').style.display = 'none';
      document.getElementById('city-content').style.display = '';
    }

    const REVIEWS_API = `https://pakspeed-worker.qaisar-roonjha.workers.dev/api/reviews?isp=${encodeURIComponent(ispName)}&limit=5`;

    function renderReviews(reviewData) {
      const isUrdu = currentLang !== 'en';
      if (!reviewData || !reviewData.stats || reviewData.stats.review_count === 0) {
        document.getElementById('reviews-section').style.display = '';
        document.getElementById('reviews-title').textContent = isUrdu ? 'صارفین کے جائزے' : 'User Reviews';
        document.getElementById('reviews-list').innerHTML = `<div class="review-cta">${isUrdu
          ? `<a href="/">${ispName} کا پہلا جائزہ لکھیں</a>`
          : `<a href="/">Be the first to review ${ispName}</a>`}</div>`;
        return;
      }

      const { reviews, stats } = reviewData;
      document.getElementById('reviews-section').style.display = '';
      document.getElementById('reviews-title').textContent = isUrdu ? 'صارفین کے جائزے' : 'User Reviews';

      // Aggregate
      const starsStr = '★'.repeat(Math.round(stats.avg_rating)) + '☆'.repeat(5 - Math.round(stats.avg_rating));
      document.getElementById('reviews-aggregate').innerHTML = `
        <div class="reviews-aggregate">
          <span class="reviews-avg">${stats.avg_rating} <span style="font-size:1.2rem;">${starsStr}</span></span>
          <span class="reviews-count">${isUrdu ? `${stats.review_count} جائزے` : `from ${stats.review_count} review${stats.review_count > 1 ? 's' : ''}`}</span>
        </div>`;

      // Review cards
      let cardsHtml = '';
      reviews.forEach(r => {
        const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
        const ago = timeAgo(r.timestamp, isUrdu);
        const city = r.city && r.city !== 'Unknown' ? r.city : '';
        const speed = r.download_mbps ? r.download_mbps.toFixed(1) + ' Mbps' : '';
        const meta = [city, speed, ago].filter(Boolean).join(' · ');
        const author = r.reviewer_name
          ? `— ${r.reviewer_name}`
          : (city ? (isUrdu ? `— ${city} سے ایک صارف` : `— A user from ${city}`) : '');

        cardsHtml += `<div class="review-card-display" data-review-id="${r.id}">
          <div class="review-card-header">
            <span class="review-card-stars">${stars}</span>
            <span class="review-card-meta">${meta}</span>
          </div>
          ${r.review_text ? `<div class="review-card-text">"${r.review_text}"</div>` : ''}
          <div class="review-card-footer">
            <span class="review-card-author">${author}</span>
            <button class="review-report-btn" onclick="reportReview(${r.id}, this)"
              title="${isUrdu ? 'نامناسب مواد کی اطلاع دیں' : 'Report inappropriate content'}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
              <span>${isUrdu ? 'رپورٹ' : 'Report'}</span>
            </button>
          </div>
        </div>`;
      });
      document.getElementById('reviews-list').innerHTML = cardsHtml;
      markAlreadyReported();
    }

    function timeAgo(ts, isUrdu) {
      const diff = Date.now() - new Date(ts + 'Z').getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 60) return isUrdu ? `${mins} منٹ پہلے` : `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return isUrdu ? `${hrs} گھنٹے پہلے` : `${hrs}h ago`;
      const days = Math.floor(hrs / 24);
      if (days < 30) return isUrdu ? `${days} دن پہلے` : `${days}d ago`;
      const months = Math.floor(days / 30);
      return isUrdu ? `${months} ماہ پہلے` : `${months}mo ago`;
    }

    Promise.all([
      fetch(API).then(r => r.json()),
      fetch(REVIEWS_API).then(r => r.json()).catch(() => null)
    ]).then(([data, reviewData]) => {
      window._ispData = data;
      window._reviewData = reviewData;
      renderIsp(data);
      if (reviewData) renderReviews(reviewData);
    }).catch(() => {
      document.getElementById('city-loading').textContent = 'Error loading data';
    });

    function reportReview(reviewId, btn) {
      const key = 'pakspeed_report_' + reviewId;
      const last = localStorage.getItem(key);
      if (last && Date.now() - Number(last) < 86400000) {
        btn.classList.add('reported');
        btn.querySelector('span').textContent = currentLang !== 'en' ? 'رپورٹ ہوگیا' : 'Reported';
        return;
      }
      fetch(`https://pakspeed-worker.qaisar-roonjha.workers.dev/api/reviews/${reviewId}/report`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
      }).then(r => r.json()).then(data => {
        if (data.success) {
          localStorage.setItem(key, Date.now());
          btn.classList.add('reported');
          btn.querySelector('span').textContent = currentLang !== 'en' ? 'رپورٹ ہوگیا' : 'Reported';
          if (data.hidden) {
            const card = btn.closest('.review-card-display');
            if (card) { card.style.opacity = '0.3'; setTimeout(() => card.remove(), 1000); }
          }
        }
      }).catch(() => {});
    }

    function markAlreadyReported() {
      document.querySelectorAll('.review-report-btn').forEach(btn => {
        const card = btn.closest('[data-review-id]');
        if (!card) return;
        const last = localStorage.getItem('pakspeed_report_' + card.dataset.reviewId);
        if (last && Date.now() - Number(last) < 86400000) {
          btn.classList.add('reported');
          btn.querySelector('span').textContent = currentLang !== 'en' ? 'رپورٹ ہوگیا' : 'Reported';
        }
      });
    }
  </script>
</body>
</html>
