  <script>
    const WORKER = 'https://pakspeed-worker.qaisar-roonjha.workers.dev/api';
    let currentLang = localStorage.getItem('pakspeed_lang') || 'ur';

    // Extract A and B from URL: /compare/X-vs-Y
    const cmpMatch = window.location.pathname.match(/^\/compare\/(.+)-vs-(.+)$/i);
    if (!cmpMatch) { window.location.href = '/'; }
    const nameA = decodeURIComponent(cmpMatch[1]);
    const nameB = decodeURIComponent(cmpMatch[2]);

    function applyLang(lang) {
      currentLang = lang;
      localStorage.setItem('pakspeed_lang', lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ur' ? 'rtl' : 'ltr';
      document.body.className = lang === 'ur' ? 'lang-ur' : 'lang-en';
      document.getElementById('btn-lang').textContent = lang === 'ur' ? 'English' : 'اردو';
      document.getElementById('back-text').textContent = lang === 'ur' ? 'سپیڈ ٹیسٹ' : 'Speed Test';
      document.getElementById('footer-madein').textContent = lang === 'ur' ? 'پاکستان میں بنایا گیا' : 'Made in Pakistan';
      document.getElementById('footer-init-text').textContent = lang === 'ur' ? 'کی ایک پہل' : 'An initiative by';
    }

    applyLang(currentLang);
    document.getElementById('btn-lang').addEventListener('click', () => {
      applyLang(currentLang === 'ur' ? 'en' : 'ur');
      if (window._cmpData) renderComparison(window._cmpData);
    });

    async function loadComparison() {
      let type = 'city';
      let dataA, dataB;
      try {
        const [rA, rB] = await Promise.all([
          fetch(`${WORKER}/city-stats?city=${encodeURIComponent(nameA)}`),
          fetch(`${WORKER}/city-stats?city=${encodeURIComponent(nameB)}`)
        ]);
        dataA = await rA.json();
        dataB = await rB.json();

        if (!dataA?.city?.total_tests || !dataB?.city?.total_tests) {
          const [iA, iB] = await Promise.all([
            fetch(`${WORKER}/isp-stats?isp=${encodeURIComponent(nameA)}`),
            fetch(`${WORKER}/isp-stats?isp=${encodeURIComponent(nameB)}`)
          ]);
          dataA = await iA.json();
          dataB = await iB.json();
          type = 'isp';
        }
      } catch (e) {
        document.getElementById('cmp-loading').textContent = 'Error loading data';
        return;
      }

      window._cmpData = { dataA, dataB, type };
      renderComparison(window._cmpData);
    }

    function renderComparison({ dataA, dataB, type }) {
      const statsA = type === 'city' ? dataA?.city : dataA?.isp;
      const statsB = type === 'city' ? dataB?.city : dataB?.isp;

      if (!statsA?.total_tests && !statsB?.total_tests) {
        document.getElementById('cmp-loading').textContent = 'No data available';
        return;
      }

      const isUrdu = currentLang === 'ur';
      const linkBase = type === 'city' ? '/city' : '/isp';

      document.getElementById('cmp-title').textContent = isUrdu
        ? `${nameA} بمقابلہ ${nameB}`
        : `${nameA} vs ${nameB}`;
      document.getElementById('cmp-subtitle').textContent = isUrdu
        ? 'انٹرنیٹ سپیڈ کا موازنہ — حقیقی ٹیسٹ ڈیٹا پر مبنی'
        : 'Internet speed comparison — based on real test data';

      document.getElementById('name-a').innerHTML = `<a href="${linkBase}/${encodeURIComponent(nameA)}">${nameA}</a>`;
      document.getElementById('name-b').innerHTML = `<a href="${linkBase}/${encodeURIComponent(nameB)}">${nameB}</a>`;

      const dlA = statsA?.avg_download || '—';
      const dlB = statsB?.avg_download || '—';
      const ulA = statsA?.avg_upload || '—';
      const ulB = statsB?.avg_upload || '—';
      const pingA = statsA?.avg_ping || '—';
      const pingB = statsB?.avg_ping || '—';

      document.getElementById('dl-a').textContent = dlA;
      document.getElementById('dl-b').textContent = dlB;
      document.getElementById('ul-a').textContent = ulA;
      document.getElementById('ul-b').textContent = ulB;
      document.getElementById('ping-a').textContent = pingA;
      document.getElementById('ping-b').textContent = pingB;

      // Winner
      const numDlA = Number(dlA), numDlB = Number(dlB);
      const winner = document.getElementById('cmp-winner');
      if (numDlA > numDlB) {
        winner.innerHTML = isUrdu
          ? `<span class="cmp-winner-name">${nameA}</span> کی سپیڈ تیز ہے!`
          : `<span class="cmp-winner-name">${nameA}</span> has faster internet!`;
      } else if (numDlB > numDlA) {
        winner.innerHTML = isUrdu
          ? `<span class="cmp-winner-name">${nameB}</span> کی سپیڈ تیز ہے!`
          : `<span class="cmp-winner-name">${nameB}</span> has faster internet!`;
      } else {
        winner.textContent = isUrdu ? 'دونوں کی سپیڈ برابر ہے' : 'Both have similar speeds';
      }

      // CTA links
      document.getElementById('cmp-cta').innerHTML = `
        <a href="${linkBase}/${encodeURIComponent(nameA)}" class="cmp-cta-btn secondary">${nameA}</a>
        <a href="/" class="cmp-cta-btn">${isUrdu ? 'سپیڈ ٹیسٹ' : 'Speed Test'}</a>
        <a href="${linkBase}/${encodeURIComponent(nameB)}" class="cmp-cta-btn secondary">${nameB}</a>
      `;

      document.getElementById('cmp-loading').style.display = 'none';
      document.getElementById('cmp-content').style.display = '';
    }

    loadComparison();
  </script>
