  <script>
    // Language toggle
    let currentLang = localStorage.getItem('pakspeed_lang') || 'ur';

    const LABELS = {
      ur: {
        title: 'آئی ایس پی موازنہ',
        subtitle: 'آج کون سا آئی ایس پی سب سے تیز؟',
        isp: 'آئی ایس پی',
        dl: 'ڈاؤن لوڈ',
        ul: 'اپ لوڈ',
        max: 'زیادہ سے زیادہ',
        ping: 'پنگ',
        tests: 'ٹیسٹ',
        loading: 'لوڈ ہو رہا ہے...',
        toggle: 'English',
        back: 'سپیڈ ٹیسٹ',
        madein: 'پاکستان میں بنایا گیا',
        init: 'کی ایک پہل',
        navCity: 'شہر',
        navIsp: 'آئی ایس پی'
      },
      en: {
        title: 'ISP Comparison',
        subtitle: 'Which ISP is the fastest today?',
        isp: 'ISP',
        dl: 'Download',
        ul: 'Upload',
        max: 'Peak',
        ping: 'Ping',
        tests: 'Tests',
        loading: 'Loading...',
        toggle: 'اردو',
        back: 'Speed Test',
        madein: 'Made in Pakistan',
        init: 'An initiative by',
        navCity: 'Cities',
        navIsp: 'ISPs'
      }
    };

    function applyLang(lang) {
      currentLang = lang;
      localStorage.setItem('pakspeed_lang', lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ur' ? 'rtl' : 'ltr';
      document.body.className = lang === 'ur' ? 'lang-ur' : 'lang-en';

      const l = LABELS[lang];
      document.getElementById('lb-title').textContent = l.title;
      document.getElementById('lb-subtitle').textContent = l.subtitle;
      document.getElementById('th-isp').textContent = l.isp;
      document.getElementById('th-dl').textContent = l.dl;
      document.getElementById('th-ul').textContent = l.ul;
      document.getElementById('th-max').textContent = l.max;
      document.getElementById('th-ping').textContent = l.ping;
      document.getElementById('th-tests').textContent = l.tests;
      document.getElementById('lb-loading').textContent = l.loading;
      document.getElementById('btn-lang').textContent = l.toggle;
      document.getElementById('lb-back-text').textContent = l.back;
      document.getElementById('footer-madein').textContent = l.madein;
      document.getElementById('footer-init-text').textContent = l.init;
      document.getElementById('nav-city-text').textContent = l.navCity;
      document.getElementById('nav-isp-text').textContent = l.navIsp;

      // Show today's date in PKT
      const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Karachi' }));
      const dateStr = now.toLocaleDateString(lang === 'ur' ? 'ur-PK' : 'en-PK', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
        timeZone: 'Asia/Karachi'
      });
      document.getElementById('lb-date').textContent = dateStr;
    }

    applyLang(currentLang);

    document.getElementById('btn-lang').addEventListener('click', () => {
      applyLang(currentLang === 'ur' ? 'en' : 'ur');
    });

    // Fetch ISP rankings data
    const API = 'https://pakspeed-worker.qaisar-roonjha.workers.dev/api/isp-rankings';

    fetch(API)
      .then(r => r.json())
      .then(data => {
        const loading = document.getElementById('lb-loading');
        const table = document.getElementById('lb-table');
        const body = document.getElementById('lb-body');

        if (!data.length) {
          loading.textContent = 'No data yet';
          return;
        }

        let html = '';
        data.forEach((row, i) => {
          const rank = i + 1;
          let medal = '';
          let rankClass = '';
          if (rank === 1) { medal = '<span class="lb-medal">🥇</span>'; rankClass = 'lb-rank-1'; }
          else if (rank === 2) { medal = '<span class="lb-medal">🥈</span>'; rankClass = 'lb-rank-2'; }
          else if (rank === 3) { medal = '<span class="lb-medal">🥉</span>'; rankClass = 'lb-rank-3'; }

          html += '<tr>';
          html += '<td><span class="lb-rank ' + rankClass + '">' + medal + rank + '</span></td>';
          html += '<td class="lb-isp"><a href="/isp/' + encodeURIComponent(row.isp_name) + '" style="color:var(--white);text-decoration:none;border-bottom:1px dashed rgba(255,255,255,0.3);transition:all 0.2s;">' + row.isp_name + '</a></td>';
          html += '<td class="lb-speed">' + row.avg_download + ' <small style="color:var(--gray-400);font-weight:400">Mbps</small></td>';
          html += '<td class="lb-upload">' + row.avg_upload + ' <small style="color:var(--gray-400);font-weight:400">Mbps</small></td>';
          html += '<td class="lb-max">' + row.max_download + ' <small style="color:var(--gray-400);font-weight:400">Mbps</small></td>';
          html += '<td class="lb-ping">' + row.avg_ping + ' <small style="color:var(--gray-400);font-weight:400">ms</small></td>';
          html += '<td class="lb-tests">' + row.total_tests + '</td>';
          html += '</tr>';
        });

        body.innerHTML = html;
        loading.style.display = 'none';
        table.style.display = '';
      })
      .catch(err => {
        document.getElementById('lb-loading').textContent = 'Error loading data';
      });
  </script>
