  <script>
    // Extract city (and optional ISP) from clean URL: /city/Lahore or /city/Lahore/PTCL
    const pathMatch = window.location.pathname.match(/^\/city\/([^\/]+)(?:\/([^\/]+))?$/);
    const cityName = pathMatch ? decodeURIComponent(pathMatch[1]) : new URLSearchParams(window.location.search).get('city');
    const focusedIsp = pathMatch && pathMatch[2] ? decodeURIComponent(pathMatch[2]) : new URLSearchParams(window.location.search).get('isp');
    let currentLang = localStorage.getItem('pakspeed_lang') || 'ur';

    if (!cityName) {
      window.location.href = '/leaderboard.html';
    }

    function applyLang(lang) {
      currentLang = lang;
      localStorage.setItem('pakspeed_lang', lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ur' ? 'rtl' : 'ltr';
      document.body.className = lang === 'ur' ? 'lang-ur' : 'lang-en';
      document.getElementById('btn-lang').textContent = lang === 'ur' ? 'English' : 'اردو';
      document.getElementById('back-text').textContent = lang === 'ur' ? 'رینکنگ' : 'Rankings';
      document.getElementById('footer-madein').textContent = lang === 'ur' ? 'پاکستان میں بنایا گیا' : 'Made in Pakistan';
      document.getElementById('footer-init-text').textContent = lang === 'ur' ? 'کی ایک پہل' : 'An initiative by';
    }

    applyLang(currentLang);
    document.getElementById('btn-lang').addEventListener('click', () => {
      applyLang(currentLang === 'ur' ? 'en' : 'ur');
      if (window._cityData) renderCity(window._cityData);
      if (window._reviewData) renderCityReviews(window._reviewData);
    });

    const API = `https://pakspeed-worker.qaisar-roonjha.workers.dev/api/city-stats?city=${encodeURIComponent(cityName)}`;

    function renderCity(data) {
      const { city, national_avg, isps } = data;
      if (!city || !city.total_tests) {
        document.getElementById('city-loading').textContent = 'No data for this city';
        return;
      }

      const isUrdu = currentLang === 'ur';

      // Find focused ISP data if present
      const focusedIspData = focusedIsp ? isps.find(i => i.isp_name.toLowerCase() === focusedIsp.toLowerCase()) : null;

      // SEO title and description — adapt for City×ISP pages
      const titleText = focusedIspData
        ? (isUrdu
          ? `${cityName} میں ${focusedIsp} سپیڈ ${focusedIspData.avg_download} Mbps — PakSpeed`
          : `${focusedIsp} Speed in ${cityName} ${focusedIspData.avg_download} Mbps — PakSpeed`)
        : (isUrdu
          ? `${cityName} انٹرنیٹ سپیڈ — PakSpeed`
          : `Internet Speed in ${cityName} — PakSpeed`);
      const descText = focusedIspData
        ? (isUrdu
          ? `${cityName} میں ${focusedIsp} کی اوسط سپیڈ ${focusedIspData.avg_download} Mbps ہے۔ شہر اوسط ${city.avg_download} Mbps۔`
          : `${focusedIsp} average speed in ${cityName}: ${focusedIspData.avg_download} Mbps. City average: ${city.avg_download} Mbps.`)
        : (isUrdu
          ? `${cityName} میں اوسط انٹرنیٹ سپیڈ ${city.avg_download} Mbps ہے۔ ${city.total_tests} ٹیسٹ کے نتائج۔`
          : `Average internet speed in ${cityName} is ${city.avg_download} Mbps based on ${city.total_tests} tests.`);

      document.getElementById('page-title').textContent = titleText;
      document.getElementById('page-desc').setAttribute('content', descText);

      // Update canonical & OG dynamically — use clean URLs
      const cityUrl = focusedIsp
        ? `https://pakspeed.com/city/${encodeURIComponent(cityName)}/${encodeURIComponent(focusedIsp)}`
        : `https://pakspeed.com/city/${encodeURIComponent(cityName)}`;
      document.getElementById('page-canonical').href = cityUrl;
      document.getElementById('hreflang-ur').href = cityUrl + '?lang=ur';
      document.getElementById('hreflang-en').href = cityUrl + '?lang=en';
      document.getElementById('hreflang-default').href = cityUrl;
      document.getElementById('og-url').content = cityUrl;
      document.getElementById('og-title').content = titleText;
      document.getElementById('og-desc').content = descText;
      document.getElementById('tw-title').content = titleText;
      document.getElementById('tw-desc').content = descText;

      // Header — adapt for City×ISP
      document.getElementById('city-name').textContent = focusedIspData
        ? (isUrdu ? `${cityName} میں ${focusedIsp} سپیڈ` : `${focusedIsp} Speed in ${cityName}`)
        : (isUrdu ? `${cityName} میں انٹرنیٹ سپیڈ` : `Internet Speed in ${cityName}`);
      document.getElementById('city-subtitle').textContent = focusedIspData
        ? (isUrdu ? `${focusedIspData.tests} ٹیسٹ کے نتائج | شہر اوسط: ${city.avg_download} Mbps` : `Based on ${focusedIspData.tests} tests | City avg: ${city.avg_download} Mbps`)
        : (isUrdu ? `${city.total_tests} سپیڈ ٹیسٹ کے نتائج پر مبنی` : `Based on ${city.total_tests} speed tests`);

      // Labels
      document.getElementById('lbl-dl').textContent = isUrdu ? 'اوسط ڈاؤن لوڈ' : 'Avg Download';
      document.getElementById('lbl-ul').textContent = isUrdu ? 'اوسط اپ لوڈ' : 'Avg Upload';
      document.getElementById('lbl-ping').textContent = isUrdu ? 'اوسط پنگ' : 'Avg Ping';
      document.getElementById('lbl-peak').textContent = isUrdu ? 'زیادہ سے زیادہ' : 'Peak Speed';

      // Values — show ISP-specific data when focused
      if (focusedIspData) {
        document.getElementById('val-dl').textContent = focusedIspData.avg_download;
        document.getElementById('val-ul').textContent = focusedIspData.avg_upload || '—';
        document.getElementById('val-ping').textContent = focusedIspData.avg_ping;
        document.getElementById('val-peak').textContent = city.max_download;
        document.getElementById('lbl-peak').textContent = isUrdu ? 'شہر اوسط' : 'City Avg';
        document.getElementById('val-peak').textContent = city.avg_download;
      } else {
        document.getElementById('val-dl').textContent = city.avg_download;
        document.getElementById('val-ul').textContent = city.avg_upload;
        document.getElementById('val-ping').textContent = city.avg_ping;
        document.getElementById('val-peak').textContent = city.max_download;
      }

      // Comparison — ISP vs city avg (City×ISP) or city vs national avg
      const compBox = document.getElementById('comparison-box');
      if (focusedIspData) {
        const ispDl = Number(focusedIspData.avg_download);
        const cityDl = Number(city.avg_download);
        const diff = (ispDl - cityDl).toFixed(1);
        const pct = ((Math.abs(diff) / cityDl) * 100).toFixed(0);
        if (diff > 0) {
          compBox.innerHTML = `<p class="comparison-text">${isUrdu
            ? `${focusedIsp} شہر اوسط سے <span class="comparison-faster">${pct}% تیز</span> ہے`
            : `${focusedIsp} is <span class="comparison-faster">${pct}% faster</span> than the ${cityName} average`
          }</p>`;
        } else {
          compBox.innerHTML = `<p class="comparison-text">${isUrdu
            ? `${focusedIsp} شہر اوسط سے <span class="comparison-slower">${pct}% کم</span> ہے`
            : `${focusedIsp} is <span class="comparison-slower">${pct}% slower</span> than the ${cityName} average`
          }</p>`;
        }
      } else {
        const diff = (city.avg_download - national_avg).toFixed(1);
        const pct = ((Math.abs(diff) / national_avg) * 100).toFixed(0);
        if (diff > 0) {
          compBox.innerHTML = `<p class="comparison-text">${isUrdu
            ? `${cityName} کی سپیڈ قومی اوسط سے <span class="comparison-faster">${pct}% تیز</span> ہے`
            : `${cityName} is <span class="comparison-faster">${pct}% faster</span> than the national average`
          }</p>`;
        } else {
          compBox.innerHTML = `<p class="comparison-text">${isUrdu
            ? `${cityName} کی سپیڈ قومی اوسط سے <span class="comparison-slower">${pct}% کم</span> ہے`
            : `${cityName} is <span class="comparison-slower">${pct}% slower</span> than the national average`
          }</p>`;
        }
      }

      // ISP table
      document.getElementById('isp-title').textContent = isUrdu
        ? `${cityName} میں آئی ایس پیز`
        : `ISPs in ${cityName}`;
      document.getElementById('th-isp').textContent = isUrdu ? 'آئی ایس پی' : 'ISP';
      document.getElementById('th-dl').textContent = isUrdu ? 'ڈاؤن لوڈ' : 'Download';
      document.getElementById('th-ping').textContent = isUrdu ? 'پنگ' : 'Ping';
      document.getElementById('th-tests').textContent = isUrdu ? 'ٹیسٹ' : 'Tests';

      let ispHtml = '';
      isps.forEach(row => {
        const isFocused = focusedIsp && row.isp_name.toLowerCase() === focusedIsp.toLowerCase();
        const rowStyle = isFocused ? 'background:rgba(0,255,136,0.08);border-left:3px solid var(--neon-green);' : '';
        const ispLink = `/city/${encodeURIComponent(cityName)}/${encodeURIComponent(row.isp_name)}`;
        ispHtml += `<tr style="${rowStyle}">
          <td><a href="${ispLink}" style="color:var(--white);text-decoration:none;border-bottom:1px dashed rgba(255,255,255,0.3);${isFocused ? 'font-weight:700;color:var(--neon-green);' : ''}">${row.isp_name}${isFocused ? ' ★' : ''}</a></td>
          <td style="color:var(--neon-green);font-weight:700">${row.avg_download} <small style="color:var(--gray-400);font-weight:400">Mbps</small></td>
          <td style="color:var(--gold);font-weight:600">${row.avg_ping} <small style="color:var(--gray-400);font-weight:400">ms</small></td>
          <td style="color:var(--gray-400)">${row.tests}</td>
        </tr>`;
      });
      document.getElementById('isp-body').innerHTML = ispHtml;

      // CTA
      document.getElementById('cta-text').textContent = focusedIspData
        ? (isUrdu ? `اپنی ${focusedIsp} سپیڈ ${cityName} میں چیک کریں!` : `Test your ${focusedIsp} speed in ${cityName}!`)
        : (isUrdu ? `${cityName} میں اپنی انٹرنیٹ سپیڈ چیک کریں!` : `Check your internet speed in ${cityName}!`);
      document.getElementById('cta-btn').textContent = isUrdu ? 'سپیڈ ٹیسٹ شروع کریں' : 'Start Speed Test';

      // Schema.org structured data — WebPage + BreadcrumbList (adapts for City×ISP)
      const schemaData = [
        {
          "@context": "https://schema.org",
          "@type": "WebPage",
          "name": titleText,
          "description": descText,
          "url": cityUrl,
          "inLanguage": ["ur", "en"],
          "mainEntity": {
            "@type": "Place",
            "name": cityName,
            "address": { "@type": "PostalAddress", "addressCountry": "PK", "addressLocality": cityName }
          },
          "isPartOf": { "@type": "WebSite", "name": "PakSpeed", "url": "https://pakspeed.com" }
        },
        {
          "@context": "https://schema.org",
          "@type": "BreadcrumbList",
          "itemListElement": focusedIspData
            ? [
              { "@type": "ListItem", "position": 1, "name": "PakSpeed", "item": "https://pakspeed.com/" },
              { "@type": "ListItem", "position": 2, "name": cityName, "item": `https://pakspeed.com/city/${encodeURIComponent(cityName)}` },
              { "@type": "ListItem", "position": 3, "name": focusedIsp }
            ]
            : [
              { "@type": "ListItem", "position": 1, "name": "PakSpeed", "item": "https://pakspeed.com/" },
              { "@type": "ListItem", "position": 2, "name": isUrdu ? "شہروں کی رینکنگ" : "City Rankings", "item": "https://pakspeed.com/leaderboard.html" },
              { "@type": "ListItem", "position": 3, "name": cityName }
            ]
        }
      ];

      // Add FAQ schema for City×ISP pages (targets People Also Ask)
      if (focusedIspData) {
        schemaData.push({
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": `What is ${focusedIsp} speed in ${cityName}?`,
              "acceptedAnswer": {
                "@type": "Answer",
                "text": `${focusedIsp} average download speed in ${cityName} is ${focusedIspData.avg_download} Mbps with ${focusedIspData.avg_ping} ms ping, based on ${focusedIspData.tests} real speed tests.`
              }
            },
            {
              "@type": "Question",
              "name": `Is ${focusedIsp} good in ${cityName}?`,
              "acceptedAnswer": {
                "@type": "Answer",
                "text": Number(focusedIspData.avg_download) >= Number(city.avg_download)
                  ? `Yes, ${focusedIsp} at ${focusedIspData.avg_download} Mbps is above the ${cityName} city average of ${city.avg_download} Mbps.`
                  : `${focusedIsp} at ${focusedIspData.avg_download} Mbps is below the ${cityName} city average of ${city.avg_download} Mbps.`
              }
            }
          ]
        });
      }

      document.getElementById('schema-json').textContent = JSON.stringify(schemaData);

      // Explore links — cross-linking for SEO (adapts for City×ISP)
      document.getElementById('explore-title').textContent = isUrdu ? 'مزید دریافت کریں' : 'Explore More';
      const majorCities = ['Lahore','Karachi','Islamabad','Rawalpindi','Faisalabad','Peshawar','Quetta','Multan'];
      let exploreHtml = '';

      if (focusedIspData) {
        // City×ISP: cross-link to same ISP in other cities + other ISPs in this city
        exploreHtml += `<a href="/city/${encodeURIComponent(cityName)}" class="explore-link">${isUrdu ? cityName + ' تمام ISPs' : cityName + ' All ISPs'}</a>`;
        exploreHtml += `<a href="/isp/${encodeURIComponent(focusedIsp)}" class="explore-link">${focusedIsp} ${isUrdu ? 'تمام شہر' : 'All Cities'}</a>`;
        majorCities.filter(c => c !== cityName).slice(0, 3).forEach(c => {
          exploreHtml += `<a href="/city/${encodeURIComponent(c)}/${encodeURIComponent(focusedIsp)}" class="explore-link secondary">${focusedIsp} ${isUrdu ? 'میں' : 'in'} ${c}</a>`;
        });
      } else {
        // Regular city page: link to nearby cities
        const nearbyCities = majorCities.filter(c => c !== cityName).slice(0, 4);
        nearbyCities.forEach(c => {
          exploreHtml += `<a href="/city/${encodeURIComponent(c)}" class="explore-link">${c}</a>`;
        });
      }

      exploreHtml += `<a href="/leaderboard.html" class="explore-link secondary">${isUrdu ? 'شہر رینکنگ' : 'City Rankings'}</a>`;
      exploreHtml += `<a href="/isp.html" class="explore-link secondary">${isUrdu ? 'آئی ایس پی موازنہ' : 'ISP Comparison'}</a>`;
      exploreHtml += `<a href="/map.html" class="explore-link secondary">${isUrdu ? 'سپیڈ میپ' : 'Speed Map'}</a>`;
      exploreHtml += `<a href="/guide.html" class="explore-link secondary">${isUrdu ? 'سپیڈ گائیڈ' : 'Speed Guide'}</a>`;
      exploreHtml += `<a href="/complaint.html" class="explore-link secondary">${isUrdu ? 'PTA شکایت' : 'PTA Complaint'}</a>`;
      exploreHtml += `<a href="/best-isp.html" class="explore-link secondary">${isUrdu ? 'بہترین ISP 2026' : 'Best ISP 2026'}</a>`;
      exploreHtml += `<a href="/report.html" class="explore-link secondary">${isUrdu ? 'آج کی رپورٹ' : "Today's Report"}</a>`;
      document.getElementById('explore-links').innerHTML = exploreHtml;

      document.getElementById('city-loading').style.display = 'none';
      document.getElementById('city-content').style.display = '';
    }

    function timeAgo(ts, isUrdu) {
      const diff = Date.now() - new Date(ts + 'Z').getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 60) return isUrdu ? `${mins} منٹ پہلے` : `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return isUrdu ? `${hrs} گھنٹے پہلے` : `${hrs}h ago`;
      const days = Math.floor(hrs / 24);
      if (days < 30) return isUrdu ? `${days} دن پہلے` : `${days}d ago`;
      return isUrdu ? `${Math.floor(days / 30)} ماہ پہلے` : `${Math.floor(days / 30)}mo ago`;
    }

    function renderCityReviews(reviewData) {
      const isUrdu = currentLang !== 'en';
      const section = document.getElementById('city-reviews-section');
      if (!reviewData || !reviewData.stats || reviewData.stats.review_count === 0) {
        section.style.display = '';
        document.getElementById('city-reviews-title').textContent = isUrdu ? 'جائزے' : 'Reviews';
        document.getElementById('city-reviews-list').innerHTML = `<div class="city-review-cta">${
          focusedIsp
            ? (isUrdu ? `<a href="/">${focusedIsp} ${cityName} میں پہلا جائزہ لکھیں</a>` : `<a href="/">Be the first to review ${focusedIsp} in ${cityName}</a>`)
            : (isUrdu ? `<a href="/">${cityName} میں پہلا جائزہ لکھیں</a>` : `<a href="/">Be the first to review in ${cityName}</a>`)
        }</div>`;
        return;
      }

      const { reviews, stats } = reviewData;
      section.style.display = '';
      const title = focusedIsp
        ? (isUrdu ? `${cityName} میں ${focusedIsp} کے جائزے` : `${focusedIsp} Reviews in ${cityName}`)
        : (isUrdu ? `${cityName} کے جائزے` : `Reviews from ${cityName}`);
      document.getElementById('city-reviews-title').textContent = title;

      let html = '';
      if (stats.avg_rating > 0) {
        const starsStr = '★'.repeat(Math.round(stats.avg_rating)) + '☆'.repeat(5 - Math.round(stats.avg_rating));
        html += `<div style="margin-bottom:1rem;font-size:0.95rem;color:var(--gray-400);">
          <span style="color:#FFD700;font-size:1.3rem;font-weight:700;">${stats.avg_rating} ${starsStr}</span>
          ${isUrdu ? `${stats.review_count} جائزے` : `from ${stats.review_count} review${stats.review_count > 1 ? 's' : ''}`}
        </div>`;
      }

      reviews.forEach(r => {
        const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
        const ago = timeAgo(r.timestamp, isUrdu);
        const ispLabel = !focusedIsp ? r.isp_name + ' · ' : '';
        const speed = r.download_mbps ? r.download_mbps.toFixed(1) + ' Mbps · ' : '';
        const author = r.reviewer_name || (isUrdu ? 'ایک صارف' : 'A user');

        html += `<div class="city-review-card" data-review-id="${r.id}">
          <div class="city-review-header">
            <span class="city-review-stars">${stars}</span>
            <span>${ispLabel}${speed}${ago}</span>
          </div>
          ${r.review_text ? `<div class="city-review-text">"${r.review_text}"</div>` : ''}
          <div class="city-review-footer">
            <span class="city-review-author">— ${author}</span>
            <button class="review-report-btn" onclick="reportReview(${r.id}, this)"
              title="${isUrdu ? 'نامناسب مواد کی اطلاع دیں' : 'Report inappropriate content'}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
              <span>${isUrdu ? 'رپورٹ' : 'Report'}</span>
            </button>
          </div>
        </div>`;
      });
      document.getElementById('city-reviews-list').innerHTML = html;
      markAlreadyReported();
    }

    const reviewsLimit = focusedIsp ? 5 : 3;
    let REVIEWS_URL = `https://pakspeed-worker.qaisar-roonjha.workers.dev/api/reviews?city=${encodeURIComponent(cityName)}&limit=${reviewsLimit}`;
    if (focusedIsp) REVIEWS_URL += `&isp=${encodeURIComponent(focusedIsp)}`;

    Promise.all([
      fetch(API).then(r => r.json()),
      fetch(REVIEWS_URL).then(r => r.json()).catch(() => null)
    ]).then(([data, reviewData]) => {
      window._cityData = data;
      window._reviewData = reviewData;
      renderCity(data);
      if (reviewData) renderCityReviews(reviewData);
    }).catch(() => {
      document.getElementById('city-loading').textContent = 'Error loading data';
    });

    function reportReview(reviewId, btn) {
      const key = 'pakspeed_report_' + reviewId;
      const last = localStorage.getItem(key);
      if (last && Date.now() - Number(last) < 86400000) {
        btn.classList.add('reported');
        btn.querySelector('span').textContent = currentLang !== 'en' ? 'رپورٹ ہوگیا' : 'Reported';
        return;
      }
      fetch(`https://pakspeed-worker.qaisar-roonjha.workers.dev/api/reviews/${reviewId}/report`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
      }).then(r => r.json()).then(data => {
        if (data.success) {
          localStorage.setItem(key, Date.now());
          btn.classList.add('reported');
          btn.querySelector('span').textContent = currentLang !== 'en' ? 'رپورٹ ہوگیا' : 'Reported';
          if (data.hidden) {
            const card = btn.closest('.city-review-card');
            if (card) { card.style.opacity = '0.3'; setTimeout(() => card.remove(), 1000); }
          }
        }
      }).catch(() => {});
    }

    function markAlreadyReported() {
      document.querySelectorAll('.review-report-btn').forEach(btn => {
        const card = btn.closest('[data-review-id]');
        if (!card) return;
        const last = localStorage.getItem('pakspeed_report_' + card.dataset.reviewId);
        if (last && Date.now() - Number(last) < 86400000) {
          btn.classList.add('reported');
          btn.querySelector('span').textContent = currentLang !== 'en' ? 'رپورٹ ہوگیا' : 'Reported';
        }
      });
    }
  </script>
</body>
</html>
